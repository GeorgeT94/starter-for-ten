<style>

html{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 "Source Sans 3",system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100%}
.top{border-bottom:1px solid var(--line);font-size:.85rem;color:var(--mute)}
.top div{max-width:760px;margin:0 auto;padding:8px 16px;display:flex;justify-content:space-between;gap:12px}
.mast{text-align:center;padding:18px 16px 12px;border-bottom:3px solid var(--rule)}
.mast h1{margin:0;font:900 clamp(2.2rem,8vw,3.4rem)/1 "Playfair Display",Georgia,serif}
.nav{border-bottom:1px solid var(--line)}
.nav div{max-width:760px;margin:0 auto;padding:10px 16px;display:flex;gap:20px;font-weight:600;font-size:.95rem}
.nav .on{color:var(--blue);border-bottom:3px solid var(--blue);margin-bottom:-11px;padding-bottom:8px}
main{max-width:760px;margin:0 auto;padding:22px 16px 56px}
.kick{color:var(--red);font-weight:700;font-size:.95rem;margin:0 0 6px}
h2{font:900 clamp(1.9rem,6vw,2.6rem)/1.1 "Playfair Display",Georgia,serif;margin:0 0 10px}
.stand{font:1.15rem/1.45 Georgia,serif;color:var(--mute);margin:0 0 20px}
table.board{width:100%;border-collapse:collapse;margin-bottom:24px;font-size:.95rem}
.board th,.board td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:center}
.board th:first-child,.board td:first-child{text-align:left;font-weight:600}
.board thead th{border-bottom:2px solid var(--rule);font-weight:700}
.box{display:inline-block;width:22px;height:22px;border-radius:0;background:var(--soft);border:0;vertical-align:middle;text-align:center;line-height:22px;font-weight:700;font-size:16px}
.box.ok{background:#a9dfbf;color:#17653a}.box.bad{background:#f5b7b1;color:#a32a22}
.box.cur{background:#bcd0ec}
.tag{font-weight:700;font-size:.95rem;color:var(--blue);margin:0 0 8px;border-top:3px solid var(--rule);padding-top:12px}
.q{font:700 1.55rem/1.3 "Playfair Display",Georgia,serif;margin:0 0 16px}
figure{margin:0 0 16px}
figure img{display:block;max-width:100%;max-height:340px;margin:0 auto;border:1px solid var(--line)}
figcaption{font-size:.85rem;color:var(--mute);margin-top:6px}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:center;text-align:left;width:100%;font:inherit;font-weight:600;padding:13px 14px;border:1.5px solid var(--ink);border-radius:2px;background:var(--bg);color:var(--ink);cursor:pointer}
.opt:hover:not(:disabled){background:var(--soft);border-color:var(--blue)}
.opt:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.opt i{font-style:normal;flex:none;width:28px;height:28px;border:1.5px solid currentColor;border-radius:50%;display:grid;place-items:center;font-size:.85rem}
.opt:disabled{cursor:default;opacity:1}
.opt.ok{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.opt.bad{background:var(--badbg);border-color:var(--bad);color:var(--bad)}
.opt.dim{border-color:var(--line);color:var(--mute)}
.fb{margin:16px 0 0;font-weight:700}.fb.ok{color:var(--ok)}.fb.bad{color:var(--bad)}
.go{margin-top:16px;font:inherit;font-weight:700;padding:12px 22px;background:var(--blue);color:#fff;border:0;border-radius:2px;cursor:pointer}
.go:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.wa{display:inline-block;text-decoration:none;margin-left:10px;background:#1e8e4f;color:#fff}
.lbh{font:900 1.4rem/1.2 "Playfair Display",Georgia,serif;margin:28px 0 4px;border-top:3px solid var(--rule);padding-top:12px}
.lbf{display:grid;gap:10px;margin:14px 0}
.lbf label{font-weight:700;font-size:.9rem;display:grid;gap:4px}
.lbf input{font:inherit;padding:11px 12px;border:1.5px solid var(--ink);border-radius:0;background:#fff;color:var(--ink)}
.lbf select{font:inherit;padding:11px 12px;border:1.5px solid var(--ink);border-radius:0;background:#fff;color:var(--ink);max-width:100%}
.lbf input:focus-visible,.lbf select:focus-visible{outline:3px solid var(--blue);outline-offset:1px}
.lbm{color:var(--bad);font-weight:600;min-height:1.4em;margin:0}
.lbt{font-size:.9rem}
.lbt th:nth-child(2),.lbt th:nth-child(3),.lbt td:nth-child(2),.lbt td:nth-child(3){text-align:left}
.lbt td:last-child{font-weight:700}
.lbt tr.me td{background:var(--soft);font-weight:700}
.alt{background:transparent;color:var(--ink);border:1.5px solid var(--ink);margin-left:10px}
.score{font:900 3.4rem/1 "Playfair Display",Georgia,serif;margin:4px 0 6px}
pre{background:var(--soft);padding:12px;font:inherit;line-height:1.6;white-space:pre-wrap;margin:14px 0}
.foot{color:var(--mute);font-size:.9rem;margin-top:14px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

function el(t,c,h){var e=document.createElement(t);if(c)e.className=c;if(h!=null)e.textContent=h;return e}
function cur(){var s=today[st.r];return st.step===0?s.s:s.b[st.step-1]}
function board(){var t=document.getElementById("board");t.innerHTML="";
var h=el("thead");var hr=el("tr");["Round","Starter","Bonus 1","Bonus 2","Bonus 3"].forEach(function(x){hr.appendChild(el("th","",x))});h.appendChild(hr);t.appendChild(h);
var b=el("tbody");today.forEach(function(set,i){var L=st.log[i],tr=el("tr");tr.appendChild(el("td","",(i+1)+(L[0]===1||(st.r===i&&st.step>0)?". "+set.t:".")));
for(var k=0;k<4;k++){var td=el("td"),bx=el("span","box"+(L[k]===1?" ok":L[k]===0?" bad":"")+(st.r===i&&st.step===k&&!st.done?" cur":""));
bx.textContent=L[k]===1?"✓":L[k]===0?"✗":"";if(k>0&&L[0]===0)bx.style.opacity=".35";td.appendChild(bx);tr.appendChild(td)}b.appendChild(tr)});t.appendChild(b)}
function render(){var S=document.getElementById("stage"),bd=document.getElementById("board");S.innerHTML="";bd.hidden=!st.started;
if(!st.started){return intro(S)}
board();
if(st.done){return finish(S)}
var set=today[st.r],q=cur();
S.appendChild(el("p","tag",st.step===0?"Starter for ten. "+DAY.sub+". Round "+(st.r+1)+" of 3":"Bonus "+st.step+" of 3 on "+set.t+". Five points"));
S.appendChild(el("p","q",q.q));
if(q.img){var f=el("figure"),im=el("img");im.src=q.img;im.alt="The painting to identify";f.appendChild(im);if(q.cap)f.appendChild(el("figcaption","",q.cap));S.appendChild(f)}
var opts=shuf([q.a].concat(q.w),rng(dayN*101+st.r*10+st.step+1)),box=el("div","opts"),fb=st.phase==="fb";
opts.forEach(function(o,i){var b=el("button","opt");b.type="button";b.appendChild(el("i","","ABCD"[i]));b.appendChild(el("span","",o));
if(fb){b.disabled=true;if(o===q.a)b.className+=" ok";else if(o===st.last.pick)b.className+=" bad";else b.className+=" dim"}
else b.onclick=function(){answer(o)};box.appendChild(b)});S.appendChild(box);
if(fb){var ok=st.last.ok;
S.appendChild(el("p","fb "+(ok?"ok":"bad"),ok?(st.step===0?"Correct. Ten points, and three bonus questions on "+set.t+".":"Correct. Five points."):"Not this time. The answer was "+q.a+"."+(st.step===0?" No bonus questions this round.":"")));
clearTimeout(adv);adv=setTimeout(advance,ok?(st.step===0?2000:1200):2400)}}
var DAYS=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
function intro(S){var prof={};try{prof=JSON.parse(localStorage.getItem("uc:profile"))||{}}catch(e){}
S.appendChild(el("p","kick",now.toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"long",year:"numeric"})));
S.appendChild(el("h2","","The "+DAYS[now.getDay()]+" Challenge, No. "+Math.max(1,dayN-20781)));
S.appendChild(el("p","stand","Three starter questions, ten points each. All three are on one subject today: "+DAY.sub.toLowerCase()+". Answer a starter correctly to win three bonus questions on a set topic, five points each. Twelve questions and 75 points in all."));
var f=el("div","lbf"),l1=el("label","","Username"),un=el("input");un.type="text";un.maxLength=20;un.autocomplete="off";un.value=prof.u||"";l1.appendChild(un);f.appendChild(l1);
var l2=el("label","","University or college"),sel=el("select"),o0=el("option","","Choose from the list\u2026");o0.value="";sel.appendChild(o0);
UNI_GROUPS.forEach(function(g){var og=el("optgroup");og.label=g[0];g[1].forEach(function(n){var o=el("option","",n);o.value=n;og.appendChild(o)});sel.appendChild(og)});
sel.value=prof.c||"";if(sel.selectedIndex<0)sel.selectedIndex=0;l2.appendChild(sel);f.appendChild(l2);S.appendChild(f);
S.appendChild(el("p","foot","Your score is added to this week\u2019s leaderboard automatically when you finish."));
var msg=el("p","lbm","");S.appendChild(msg);
var b=el("button","go","Begin");
b.onclick=function(){var u=un.value.trim().replace(/\s+/g," ");if(u.length<2){msg.textContent="Please enter a username of at least two characters.";return}if(!sel.value){msg.textContent="Please choose your university or college from the list.";return}
st.prof={u:u,c:sel.value};try{localStorage.setItem("uc:profile",JSON.stringify(st.prof))}catch(e){}
st.started=true;st.t0=Date.now();save();render()};
S.appendChild(b);var l=el("button","go alt","Weekly leaderboard");l.onclick=lbPage;S.appendChild(l)}
function api(method,body){return fetch("/api/leaderboard",{method:method,headers:body?{"Content-Type":"application/json"}:{},body:body?JSON.stringify(body):undefined}).catch(function(){throw new Error("The leaderboard isn\u2019t available right now.")}).then(function(r){return r.json().catch(function(){return{}}).then(function(j){if(!r.ok)throw new Error(j.error||"The leaderboard isn\u2019t available right now.");return j})})}
function showLB(box,prof){box.appendChild(el("h3","lbh","This week\u2019s leaderboard"));
var info=el("p","foot","Loading\u2026");box.appendChild(info);
api("GET").then(function(d){var wk=new Date(d.week+"T00:00:00Z");
info.textContent="Week commencing Monday "+wk.toLocaleDateString("en-GB",{day:"numeric",month:"long",timeZone:"UTC"})+". Totals reset every Monday.";
if(!d.players.length){info.textContent+=" No scores yet, so be the first.";return}
var t=el("table","board lbt"),h=el("thead"),hr=el("tr");["#","Player","University","Points"].forEach(function(x){hr.appendChild(el("th","",x))});h.appendChild(hr);t.appendChild(h);
var tb=el("tbody");d.players.forEach(function(p,i){var mine=prof&&p.username.toLowerCase()===(prof.u||"").toLowerCase()&&p.university===(prof.c||"");
if(i<20||mine){var tr=el("tr",mine?"me":"");[i+1,p.username,p.university,p.total].forEach(function(x){tr.appendChild(el("td","",String(x)))});tb.appendChild(tr)}});
t.appendChild(tb);box.appendChild(t)}).catch(function(e){info.textContent=e.message})}
function lbPage(){var S=document.getElementById("stage");S.innerHTML="";var prof=st.prof;if(!prof){try{prof=JSON.parse(localStorage.getItem("uc:profile"))}catch(e){}}
var box=el("div","lbx");S.appendChild(box);showLB(box,prof);var bk=el("button","go","Back");bk.onclick=render;S.appendChild(bk)}
var subbing=false,subErr="";
function submitScore(done){if(st.submitted||subbing||!st.prof)return;subbing=true;subErr="";
api("POST",{username:st.prof.u,university:st.prof.c,score:st.score,date:KEY}).then(function(){st.submitted=true;save()}).catch(function(e){subErr=e.message}).then(function(){subbing=false;if(done)done()})}
function finalLB(S){var box=el("div","lbx"),msg=el("p","foot",""),rt=el("button","go alt","Try again"),v=el("button","go","View leaderboard");rt.style.marginLeft="0";v.onclick=lbPage;
function paint(){if(!st.prof){msg.textContent="";rt.hidden=true;return}
if(st.submitted){msg.textContent="Your score has been added to this week\u2019s leaderboard.";rt.hidden=true}
else if(subbing){msg.textContent="Saving your score\u2026";rt.hidden=true}
else{msg.textContent=(subErr||"Your score hasn\u2019t been saved yet.");rt.hidden=false}}
rt.onclick=function(){submitScore(paint);paint()};
box.appendChild(msg);box.appendChild(v);box.appendChild(rt);S.appendChild(box);
if(!st.submitted&&!subbing){submitScore(paint)}paint()}
var adv=0,SITE="https://starter-for-ten.vercel.app";
function lastStep(){return st.r===2&&(st.step===3||(st.step===0&&!st.last.ok))}
function answer(o){var q=cur(),ok=o===q.a;st.log[st.r][st.step]=ok?1:0;if(ok)st.score+=st.step===0?10:5;st.last={ok:ok,pick:o};st.phase="fb";save();render()}
function advance(){clearTimeout(adv);if(st.phase!=="fb")return;var ok=st.last.ok;
if(st.step===0&&ok){st.step=1}else if(st.step>0&&st.step<3){st.step++}else{if(st.r===2){st.done=true;st.t1=Date.now()}else{st.r++;st.step=0}}
st.phase="ask";save();render()}
function finish(S){var t=st.score>=60?"Professor":st.score>=40?"Fellow":st.score>=20?"Graduate":"Fresher";
var secs=Math.max(0,Math.round(((st.t1||Date.now())-st.t0)/1000)),tm=Math.floor(secs/60)+":"+String(secs%60).padStart(2,"0");S.appendChild(el("p","tag","Final score. Your rank: "+t));S.appendChild(el("div","score",st.score+" / 75"));
var lines=st.log.map(function(L,i){var b="";if(L[0]===1)for(var k=1;k<=3;k++)b+=L[k]===1?"🔵":"⚫";else b="🚫";return "Round "+(i+1)+"  "+(L[0]===1?"🟩":"🟥")+"  "+b});
var txt="Starter for Ten "+KEY+"\n"+lines.join("\n")+"\nScore: "+st.score+"/75";
S.appendChild(el("pre","",txt));
var b=el("button","go","Copy result");b.onclick=function(){try{navigator.clipboard.writeText(txt+"\n"+SITE).then(function(){b.textContent="Copied"},function(){b.textContent="Select the text above to copy"})}catch(e){b.textContent="Select the text above to copy"}};S.appendChild(b);
if(/Android|iPhone|iPad|iPod/i.test(navigator.userAgent)||(navigator.maxTouchPoints>1&&/Macintosh/.test(navigator.userAgent))){var w=el("a","go wa","Share on WhatsApp");w.href="https://wa.me/?text="+encodeURIComponent(txt+"\n"+SITE);w.target="_blank";w.rel="noopener";S.appendChild(w)}
finalLB(S);
var m=el("p","foot","");S.appendChild(m);
function tick(){var n=new Date(),nx=new Date(n.getFullYear(),n.getMonth(),n.getDate()+1),s=Math.floor((nx-n)/1000);m.textContent="Next challenge in "+Math.floor(s/3600)+"h "+String(Math.floor(s%3600/60)).padStart(2,"0")+"m."}
tick();setInterval(tick,30000)}
render();
</script>
